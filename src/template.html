<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Weather App</title>
    </head>
    <body>
        <div class="content">
            <header>
                <form class="location-form">
                    <input class="location-search" type="text" value="Seoul" />
                    <div class="validation-error hidden">
                        No matching location found!
                    </div>
                    <input type="submit" style="display: none" />
                </form>
                <input
                    class="temp-unit-toggle"
                    type="checkbox"
                    id="temp-units"
                />
                <label for="temp-units" class="toggle-container">
                    <div>US</div>
                    <div>Metric</div>
                </label>
            </header>
            <div class="general">
                <div class="weather-info">
                    <p class="condition"></p>
                    <h1 class="location"></h1>
                    <div class="details">
                        <div class="temp"></div>
                        <div class="misc">
                            <div class="feels-like"></div>
                            <div class="wind-speed"></div>
                            <div class="humidity"></div>
                            <div class="uv-index"></div>
                        </div>
                    </div>
                </div>
                <div class="gif"></div>
            </div>
        </div>
    </body>
</html>
